<!doctype html>
<html lang="tr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>E-posta Onaylandı | React Rehberi</title>
    <meta
      name="description"
      content="React Rehberi hesabınızın e-posta adresi başarıyla doğrulandı."
    />
    <style>
      :root {
        color-scheme: dark;
        font-family:
          Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont,
          "Segoe UI", sans-serif;
        background: #020617;
        color: #e5e7eb;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 24px;
        background:
          radial-gradient(circle at top, rgba(34, 197, 94, 0.18), transparent 34rem),
          #020617;
      }

      main {
        width: min(100%, 520px);
        padding: 32px;
        border: 1px solid #1e293b;
        border-radius: 18px;
        background: rgba(15, 23, 42, 0.92);
        box-shadow: 0 24px 70px rgba(0, 0, 0, 0.35);
        text-align: center;
      }

      .mark {
        width: 64px;
        height: 64px;
        display: grid;
        place-items: center;
        margin: 0 auto 20px;
        border-radius: 999px;
        background: #16a34a;
        color: white;
        font-size: 36px;
        font-weight: 800;
      }

      h1 {
        margin: 0 0 12px;
        color: #f8fafc;
        font-size: clamp(28px, 7vw, 38px);
        line-height: 1.1;
      }

      p {
        margin: 0;
        color: #cbd5e1;
        font-size: 17px;
        line-height: 1.6;
      }

      .actions {
        display: flex;
        flex-direction: column;
        gap: 12px;
        margin-top: 28px;
      }

      a {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        min-height: 48px;
        padding: 12px 18px;
        border-radius: 12px;
        text-decoration: none;
        font-weight: 800;
      }

      .primary {
        background: #16a34a;
        color: white;
      }

      .secondary {
        border: 1px solid #334155;
        color: #cbd5e1;
      }

      small {
        display: block;
        margin-top: 20px;
        color: #94a3b8;
        line-height: 1.5;
      }
    </style>
  </head>
  <body>
    <main>
      <div class="mark" aria-hidden="true">✓</div>
      <h1>E-posta Onaylandı</h1>
      <p>
        E-posta adresiniz başarıyla doğrulandı. Artık React Rehberi uygulamasını
        açarak hesabınıza giriş yapabilirsiniz.
      </p>
      <div class="actions">
        <a class="primary" href="reactlearningapp://auth-callback">Uygulamayı Aç</a>
        <a class="secondary" href="https://doc-hosting.flycricket.io/reactlearningapp-privacy-policy/fcf74186-d39a-4bfb-a4db-32ad96e3824a/privacy">
          Gizlilik Politikasını Görüntüle
        </a>
      </div>
      <small>
        Uygulama otomatik açılmazsa React Rehberi'ni telefonunuzdan manuel olarak
        açıp giriş yapabilirsiniz.
      </small>
    </main>
  </body>
</html>
